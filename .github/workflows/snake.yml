name: generate-snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: dwifahrisal
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#0f766e&color_dots_1=#134e4a&color_dots_2=#115e59&color_dots_3=#14b8a6&color_dots_4=#2dd4bf
            dist/snake-dark.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#0f766e&color_dots_1=#134e4a&color_dots_2=#115e59&color_dots_3=#14b8a6&color_dots_4=#2dd4bf
            dist/snake-light.svg?palette=github-light&color_snake=#0d9488&color_dots=#99f6e4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}